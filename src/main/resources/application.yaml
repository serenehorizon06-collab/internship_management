spring:
  application:
    name: internship-management
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/internship_management}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    open-in-view: false

app:
  jwt:
    secret: ${JWT_SECRET:CHANGE_ME_TO_A_LONG_SECRET_FOR_LOCAL_DEV_ONLY}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
